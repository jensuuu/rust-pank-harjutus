[package]
name = "rust-bank"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
password-hash = { version = "0.5", features = ["getrandom"] }
rand = "0.10"
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
md-5 = "0.10"
argon2 = "0.5"
bcrypt = "0.17"
scrypt = "0.11"
hex = "0.4"
base64 = "0.22"
